<!DOCTYPE html>
<html>
<head>
  <title>ThorVG Custom Sysroot WASM Test</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    canvas { border: 1px solid #444; background: #000; display: block; margin: 10px 0; }
    .info { margin: 10px 0; padding: 10px; background: #16213e; border-radius: 4px; max-height: 300px; overflow-y: auto; }
    .ok { color: #4ecca3; }
    .err { color: #e23e57; }
    .warn { color: #f0c040; }
    h1 { color: #4ecca3; font-size: 18px; }
  </style>
</head>
<body>
  <h1>ThorVG - Custom Sysroot WASM32 (603KB, SW Renderer)</h1>
  <div class="info" id="log">Loading...</div>
  <canvas id="canvas" width="400" height="400"></canvas>

<script>
async function main() {
  const log = document.getElementById('log');
  const canvas = document.getElementById('canvas');
  const ctx2d = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function addLog(msg, type = 'ok') {
    log.innerHTML += `<div class="${type}">${msg}</div>`;
    log.scrollTop = log.scrollHeight;
  }

  try {
    addLog('Loading thorvg_custom_opt.wasm...');
    const t0 = performance.now();
    const response = await fetch('build_wasm_clang/thorvg_custom_opt.wasm');
    const bytes = await response.arrayBuffer();
    addLog(`WASM loaded: ${(bytes.byteLength / 1024).toFixed(1)}KB in ${(performance.now()-t0).toFixed(0)}ms`);

    let instance;
    const imports = {
      env: {
        setjmp: () => 0,
        longjmp: () => { console.error('longjmp called'); },
        emscripten_resize_heap: (requestedSize) => {
          const mem = instance.exports.memory;
          const cur = mem.buffer.byteLength;
          if (requestedSize <= cur) return 1;
          try { mem.grow(Math.ceil((requestedSize - cur) / 65536)); return 1; }
          catch(e) { return 0; }
        },
        _abort_js: () => { throw new Error('abort'); },
        __cxa_atexit: () => 0,
        __errno_location: () => 0,
        strtol: () => 0,
        __strchrnul: (s, c) => {
          const mem = new Uint8Array(instance.exports.memory.buffer);
          let i = s;
          while (mem[i] !== 0 && mem[i] !== (c & 0xff)) i++;
          return i;
        },
        __memrchr: (s, c, n) => {
          const mem = new Uint8Array(instance.exports.memory.buffer);
          for (let i = s + n - 1; i >= s; i--) {
            if (mem[i] === (c & 0xff)) return i;
          }
          return 0;
        },
        vsnprintf: () => 0,
        vfprintf: () => 0,
        fputc: () => 0,
      },
      wasi_snapshot_preview1: {
        fd_write: () => 0,
        fd_close: () => 0,
        fd_seek: () => 0,
      },
    };

    const t1 = performance.now();
    const result = await WebAssembly.instantiate(bytes, imports);
    instance = result.instance;
    const wasm = instance.exports;
    const memory = wasm.memory;
    addLog(`Instantiated in ${(performance.now()-t1).toFixed(0)}ms. Exports: ${Object.keys(wasm).length}`);

    addLog('Creating SW canvas...');
    const ctx = wasm.tvg_wcanvas_create(W, H);
    if (!ctx) { addLog('tvg_wcanvas_create returned null!', 'err'); return; }

    const errPtr = wasm.tvg_wcanvas_error(ctx);
    let errStr = '';
    if (errPtr) {
      const v = new Uint8Array(memory.buffer, errPtr, 256);
      for (let i = 0; i < 256 && v[i]; i++) errStr += String.fromCharCode(v[i]);
    }
    addLog(`Canvas state: "${errStr}"`);

    const canvasPtr = wasm.tvg_wcanvas_ptr(ctx);
    if (!canvasPtr) { addLog('Canvas pointer is null', 'err'); return; }

    addLog('Drawing shapes...');
    const s1 = wasm.tvg_shape_new();
    wasm.tvg_shape_append_rect(s1, 50, 50, 200, 150, 10, 10, 1);
    wasm.tvg_shape_set_fill_color(s1, 230, 57, 70, 255);
    wasm.tvg_canvas_add(canvasPtr, s1);

    const s2 = wasm.tvg_shape_new();
    wasm.tvg_shape_append_circle(s2, 280, 280, 80, 80, 1);
    wasm.tvg_shape_set_fill_color(s2, 69, 123, 157, 255);
    wasm.tvg_canvas_add(canvasPtr, s2);

    const s3 = wasm.tvg_shape_new();
    wasm.tvg_shape_move_to(s3, 200, 50);
    wasm.tvg_shape_line_to(s3, 350, 200);
    wasm.tvg_shape_line_to(s3, 50, 200);
    wasm.tvg_shape_close(s3);
    wasm.tvg_shape_set_fill_color(s3, 76, 201, 160, 200);
    wasm.tvg_shape_set_stroke_width(s3, 3);
    wasm.tvg_shape_set_stroke_color(s3, 255, 255, 255, 255);
    wasm.tvg_canvas_add(canvasPtr, s3);

    const t2 = performance.now();
    wasm.tvg_canvas_update(canvasPtr);
    wasm.tvg_canvas_draw(canvasPtr, 0);
    wasm.tvg_canvas_sync(canvasPtr);
    addLog(`Render took ${(performance.now()-t2).toFixed(1)}ms`);

    const bufPtr = wasm.tvg_wcanvas_render(ctx);
    const bufSize = wasm.tvg_wcanvas_render_size(ctx);

    if (bufPtr && bufSize > 0) {
      const pixels = new Uint8ClampedArray(memory.buffer, bufPtr, bufSize);
      const imageData = new ImageData(pixels, W, H);
      ctx2d.putImageData(imageData, 0, 0);
      addLog('Rendered to canvas!');
    } else {
      addLog(`No render output (ptr=0x${bufPtr.toString(16)}, size=${bufSize})`, 'err');
    }

    addLog(`Total: ${(performance.now()-t0).toFixed(0)}ms`);

  } catch (e) {
    addLog(`Error: ${e.message}`, 'err');
    console.error(e);
  }
}

main();
</script>
</body>
</html>
